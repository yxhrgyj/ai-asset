spring:
  application:
    name: ai-asset-platform

  autoconfigure:
    # 关掉 Spring Security 的默认内存用户自动配置。
    # 不关的话每次启动会打印一个随机生成的 user 口令，且注册一个
    # inMemoryUserDetailsManager——本项目用自建 users 表认证，
    # 那个账号既无用又容易让人误以为是系统账号。
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

  datasource:
    url: jdbc:postgresql://localhost:5432/ai_asset
    username: ai_asset
    password: localdev
    hikari:
      maximum-pool-size: 10

  jpa:
    open-in-view: false
    hibernate:
      # 表结构由 Flyway 管理，Hibernate 只读不改。
      # 设为 none 是硬要求：让 Hibernate 建表会与迁移脚本冲突，
      # 且触发器和 CHECK 约束不会被创建。
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Shanghai

  flyway:
    enabled: true
    locations: classpath:db/migration
    # 生产不允许自动清库
    clean-disabled: true

  servlet:
    multipart:
      # 与 UploadPolicy.MAX_BYTES 对齐（10MB）。此处放宽 1MB 余量，
      # 让超限请求走到 UploadPolicy 得到中文报错，而不是被容器直接掐断连接。
      max-file-size: 11MB
      max-request-size: 12MB

server:
  port: 8080
  servlet:
    session:
      timeout: 8h
      cookie:
        http-only: true
        same-site: lax
        # 本地开发用 HTTP，故 secure 关闭。
        # 上公网前必须改 true（同时启用 HTTPS），见方案文档 5.5 档二。
        secure: false

app:
  storage:
    # 资产文件存放根目录。本地开发用相对路径，
    # 服务器上改为独立数据盘挂载点（如 /data/asset-files）。
    root: ./data/asset-files
  bootstrap:
    # 首次启动创建的管理员账号。首登强制改口令。
    admin-username: admin
    admin-password: ChangeMe_0901
    admin-display-name: 系统管理员

logging:
  level:
    root: INFO
    com.company.aiasset: DEBUG
