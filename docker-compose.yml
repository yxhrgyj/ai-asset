services:
  postgres:
    image: postgres:16-alpine
    container_name: ai-asset-db
    environment:
      POSTGRES_DB: ai_asset
      POSTGRES_USER: ai_asset
      POSTGRES_PASSWORD: localdev
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_asset"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
